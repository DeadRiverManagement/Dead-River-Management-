<script>
(function () {
  if (!/^\/(demandflow|book)\/?$/.test(location.pathname) || typeof fbq !== 'function') return;
  var id = {{DLV - DRM Event ID}};
  var industry = {{DLV - DRM Industry}};
  var labels = {
    'home-services': 'Home Services',
    'dental': 'Dental',
    'real-estate': 'Real Estate',
    'ecommerce': 'E-commerce',
    'med-spas': 'Med Spas'
  };
  if (typeof id !== 'string' || !/^drm_inquiry_[a-f0-9-]{36}$/i.test(id)) return;
  if (typeof industry !== 'string' || !Object.prototype.hasOwnProperty.call(labels, industry)) return;
  fbq('trackSingle', '4422109568077296', 'Lead', {
    content_name: 'DRM - ' + labels[industry] + ' - Saved Inquiry',
    content_category: labels[industry],
    industry: industry
  }, {eventID: id});
})();
</script>
