<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="A carrier invoice with flagged line items and a recovered refund total">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F6E39C"/><stop offset=".34" stop-color="#E7C568"/>
      <stop offset=".68" stop-color="#C79A3C"/><stop offset="1" stop-color="#8E6417"/>
    </linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1B1B1E"/><stop offset="1" stop-color="#121214"/>
    </linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#E7C568" stroke-opacity=".05" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="#0B0B0C"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <circle cx="960" cy="120" r="300" fill="#E7C568" opacity=".05"/>

  <!-- invoice sheet -->
  <g transform="translate(150 95)">
    <rect x="0" y="0" width="470" height="440" rx="14" fill="url(#paper)" stroke="#E7C568" stroke-opacity=".28"/>
    <rect x="0" y="0" width="470" height="62" rx="14" fill="#E7C568" fill-opacity=".08"/>
    <rect x="34" y="24" width="150" height="14" rx="7" fill="url(#g)" opacity=".85"/>
    <rect x="352" y="24" width="84" height="14" rx="7" fill="#F3EEDF" opacity=".22"/>

    <!-- line items: flagged ones in gold -->
    <g>
      <rect x="34" y="98"  width="250" height="11" rx="5.5" fill="#F3EEDF" opacity=".16"/><rect x="352" y="98"  width="84" height="11" rx="5.5" fill="#F3EEDF" opacity=".16"/>
      <rect x="34" y="140" width="300" height="11" rx="5.5" fill="url(#g)"/><rect x="352" y="140" width="84" height="11" rx="5.5" fill="url(#g)"/>
      <rect x="16" y="134" width="4" height="23" rx="2" fill="#E7C568"/>
      <rect x="34" y="182" width="222" height="11" rx="5.5" fill="#F3EEDF" opacity=".16"/><rect x="352" y="182" width="84" height="11" rx="5.5" fill="#F3EEDF" opacity=".16"/>
      <rect x="34" y="224" width="276" height="11" rx="5.5" fill="url(#g)"/><rect x="352" y="224" width="84" height="11" rx="5.5" fill="url(#g)"/>
      <rect x="16" y="218" width="4" height="23" rx="2" fill="#E7C568"/>
      <rect x="34" y="266" width="238" height="11" rx="5.5" fill="#F3EEDF" opacity=".16"/><rect x="352" y="266" width="84" height="11" rx="5.5" fill="#F3EEDF" opacity=".16"/>
      <rect x="34" y="308" width="290" height="11" rx="5.5" fill="url(#g)"/><rect x="352" y="308" width="84" height="11" rx="5.5" fill="url(#g)"/>
      <rect x="16" y="302" width="4" height="23" rx="2" fill="#E7C568"/>
    </g>

    <path d="M34 358H436" stroke="#E7C568" stroke-opacity=".3" stroke-width="1.5"/>
    <rect x="34" y="380" width="130" height="13" rx="6.5" fill="#F3EEDF" opacity=".3"/>
    <rect x="316" y="376" width="120" height="21" rx="10.5" fill="url(#g)"/>
  </g>

  <!-- magnifier -->
  <g transform="translate(560 330)" fill="none" stroke="url(#g)" stroke-width="12" stroke-linecap="round">
    <circle cx="0" cy="0" r="72"/>
    <path d="M52 52L112 112"/>
  </g>

  <!-- refund callout -->
  <g transform="translate(720 150)">
    <rect x="0" y="0" width="340" height="132" rx="16" fill="#141416" stroke="#E7C568" stroke-opacity=".3"/>
    <rect x="28" y="30" width="180" height="12" rx="6" fill="#F3EEDF" opacity=".28"/>
    <rect x="28" y="66" width="240" height="30" rx="15" fill="url(#g)"/>
  </g>
  <g transform="translate(720 316)" fill="none" stroke="#E7C568" stroke-opacity=".55" stroke-width="6" stroke-linecap="round">
    <path d="M14 62 44 26 74 48 116 0"/>
    <path d="M100 0h20v20" stroke-linejoin="round"/>
  </g>
</svg>
