<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="A delivery clock past its commitment time beside a refund credit on a carrier invoice">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F6E39C"/><stop offset=".34" stop-color="#E7C568"/>
      <stop offset=".68" stop-color="#C79A3C"/><stop offset="1" stop-color="#8E6417"/>
    </linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#E7C568" stroke-opacity=".05" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="#0B0B0C"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <circle cx="330" cy="315" r="300" fill="#E7C568" opacity=".05"/>

  <!-- clock past commitment -->
  <g transform="translate(330 315)">
    <circle r="176" fill="#141416" stroke="url(#g)" stroke-width="10"/>
    <circle r="176" fill="none" stroke="#E7C568" stroke-opacity=".25" stroke-width="26"
            stroke-dasharray="248 858" stroke-dashoffset="-276" transform="rotate(-90)"/>
    <g stroke="#E7C568" stroke-opacity=".5" stroke-width="6" stroke-linecap="round">
      <path d="M0 -142V-120"/><path d="M142 0h-22"/><path d="M0 142v-22"/><path d="M-142 0h22"/>
    </g>
    <g stroke="url(#g)" stroke-width="12" stroke-linecap="round">
      <path d="M0 0V-96"/><path d="M0 0 74 44"/>
    </g>
    <circle r="13" fill="#E7C568"/>
    <!-- commitment tick, overshot -->
    <g transform="rotate(45)"><path d="M0 -176v-30" stroke="#F3EEDF" stroke-opacity=".55" stroke-width="6" stroke-linecap="round"/></g>
  </g>

  <!-- invoice with credit line -->
  <g transform="translate(660 132)">
    <rect x="0" y="0" width="420" height="366" rx="16" fill="#141416" stroke="#E7C568" stroke-opacity=".3"/>
    <rect x="0" y="0" width="420" height="58" rx="16" fill="#E7C568" fill-opacity=".08"/>
    <rect x="30" y="22" width="140" height="13" rx="6.5" fill="url(#g)" opacity=".85"/>

    <rect x="30" y="92"  width="210" height="11" rx="5.5" fill="#F3EEDF" opacity=".16"/><rect x="304" y="92"  width="86" height="11" rx="5.5" fill="#F3EEDF" opacity=".16"/>
    <rect x="30" y="134" width="252" height="11" rx="5.5" fill="#F3EEDF" opacity=".16"/><rect x="304" y="134" width="86" height="11" rx="5.5" fill="#F3EEDF" opacity=".16"/>
    <rect x="30" y="176" width="186" height="11" rx="5.5" fill="#F3EEDF" opacity=".16"/><rect x="304" y="176" width="86" height="11" rx="5.5" fill="#F3EEDF" opacity=".16"/>

    <!-- credit line, highlighted -->
    <rect x="14" y="212" width="392" height="46" rx="10" fill="#E7C568" fill-opacity=".12"/>
    <rect x="30" y="228" width="230" height="14" rx="7" fill="url(#g)"/>
    <rect x="296" y="226" width="94" height="18" rx="9" fill="url(#g)"/>

    <path d="M30 296H390" stroke="#E7C568" stroke-opacity=".3" stroke-width="1.5"/>
    <rect x="30" y="318" width="120" height="13" rx="6.5" fill="#F3EEDF" opacity=".3"/>
    <rect x="272" y="314" width="118" height="21" rx="10.5" fill="url(#g)"/>
  </g>

  <!-- 15-day window badge -->
  <g transform="translate(660 528)">
    <rect x="0" y="0" width="420" height="62" rx="31" fill="#141416" stroke="#E7C568" stroke-opacity=".35"/>
    <circle cx="42" cy="31" r="14" fill="none" stroke="url(#g)" stroke-width="5"/>
    <path d="M42 22v10l7 5" fill="none" stroke="url(#g)" stroke-width="4" stroke-linecap="round"/>
    <rect x="76" y="24" width="180" height="14" rx="7" fill="url(#g)" opacity=".8"/>
    <rect x="272" y="24" width="112" height="14" rx="7" fill="#F3EEDF" opacity=".2"/>
  </g>
</svg>
