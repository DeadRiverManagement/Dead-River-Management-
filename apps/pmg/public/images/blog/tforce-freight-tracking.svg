<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="A freight bill of lading with the PRO number highlighted, next to a list of tracking scans">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F6E39C"/><stop offset=".34" stop-color="#E7C568"/>
      <stop offset=".68" stop-color="#C79A3C"/><stop offset="1" stop-color="#8E6417"/>
    </linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#E7C568" stroke-opacity=".05" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="#0B0B0C"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <circle cx="280" cy="140" r="280" fill="#E7C568" opacity=".05"/>

  <!-- BOL document -->
  <g transform="translate(120 90)">
    <rect x="0" y="0" width="440" height="450" rx="14" fill="#141416" stroke="#E7C568" stroke-opacity=".3"/>
    <rect x="0" y="0" width="440" height="56" rx="14" fill="#E7C568" fill-opacity=".08"/>
    <rect x="30" y="21" width="160" height="13" rx="6.5" fill="#F3EEDF" opacity=".28"/>

    <!-- PRO number block, highlighted -->
    <rect x="18" y="82" width="404" height="86" rx="10" fill="#E7C568" fill-opacity=".13" stroke="#E7C568" stroke-opacity=".5"/>
    <rect x="38" y="98" width="86" height="11" rx="5.5" fill="#E7C568" opacity=".8"/>
    <g fill="url(#g)">
      <rect x="38" y="124" width="7" height="28"/><rect x="51" y="124" width="4" height="28"/>
      <rect x="61" y="124" width="9" height="28"/><rect x="76" y="124" width="4" height="28"/>
      <rect x="86" y="124" width="4" height="28"/><rect x="96" y="124" width="9" height="28"/>
      <rect x="111" y="124" width="4" height="28"/><rect x="121" y="124" width="7" height="28"/>
      <rect x="134" y="124" width="4" height="28"/><rect x="144" y="124" width="9" height="28"/>
    </g>
    <rect x="252" y="126" width="150" height="24" rx="12" fill="url(#g)"/>

    <g>
      <rect x="38" y="204" width="150" height="10" rx="5" fill="#F3EEDF" opacity=".16"/>
      <rect x="38" y="228" width="230" height="10" rx="5" fill="#F3EEDF" opacity=".16"/>
      <rect x="252" y="204" width="150" height="10" rx="5" fill="#F3EEDF" opacity=".16"/>
      <rect x="252" y="228" width="120" height="10" rx="5" fill="#F3EEDF" opacity=".16"/>
      <path d="M38 268H402" stroke="#E7C568" stroke-opacity=".22"/>
      <rect x="38" y="292" width="190" height="10" rx="5" fill="#F3EEDF" opacity=".16"/>
      <rect x="38" y="316" width="140" height="10" rx="5" fill="#F3EEDF" opacity=".16"/>
      <rect x="252" y="292" width="150" height="10" rx="5" fill="#F3EEDF" opacity=".16"/>
      <path d="M38 356H402" stroke="#E7C568" stroke-opacity=".22"/>
      <rect x="38" y="382" width="120" height="12" rx="6" fill="#F3EEDF" opacity=".3"/>
      <rect x="292" y="378" width="110" height="20" rx="10" fill="url(#g)" opacity=".8"/>
    </g>
  </g>

  <!-- tracking scan timeline -->
  <g transform="translate(680 120)">
    <path d="M22 14V378" stroke="#E7C568" stroke-opacity=".28" stroke-width="3"/>
    <g>
      <circle cx="22" cy="24" r="13" fill="url(#g)"/>
      <rect x="60" y="10" width="150" height="12" rx="6" fill="url(#g)" opacity=".85"/>
      <rect x="60" y="32" width="220" height="9" rx="4.5" fill="#F3EEDF" opacity=".18"/>
    </g>
    <g transform="translate(0 100)">
      <circle cx="22" cy="24" r="13" fill="url(#g)"/>
      <rect x="60" y="10" width="120" height="12" rx="6" fill="url(#g)" opacity=".85"/>
      <rect x="60" y="32" width="250" height="9" rx="4.5" fill="#F3EEDF" opacity=".18"/>
    </g>
    <g transform="translate(0 200)">
      <circle cx="22" cy="24" r="13" fill="url(#g)"/>
      <rect x="60" y="10" width="180" height="12" rx="6" fill="url(#g)" opacity=".85"/>
      <rect x="60" y="32" width="200" height="9" rx="4.5" fill="#F3EEDF" opacity=".18"/>
    </g>
    <g transform="translate(0 300)">
      <circle cx="22" cy="24" r="13" fill="none" stroke="#E7C568" stroke-width="4" stroke-opacity=".55"/>
      <rect x="60" y="10" width="140" height="12" rx="6" fill="#F3EEDF" opacity=".24"/>
      <rect x="60" y="32" width="170" height="9" rx="4.5" fill="#F3EEDF" opacity=".12"/>
    </g>
  </g>
</svg>
